[package]
name = "flip"
version = "1.0.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
axum = { version = "=0.8.9", features = ["multipart"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "io-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
rand = "=0.10.3"
tower-http = { version = "=0.7.1", features = ["cors"] }
async-compression = { version = "=0.4.50", features = ["gzip", "zstd", "tokio"] }
rust-embed = { version = "=8.13.0" }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
