services:
  flip:
    image: flip:local
    build:
      context: .
      args:
        OCI_REVISION: ${OCI_REVISION:-}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FLIP_BIND: "0.0.0.0"
      FLIP_PORT: "8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
